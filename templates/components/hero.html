{% load static %}

<section class="hero" style="background-image: url('{% static 'images/hero.jpg' %}');">
    <div class="container hero-container">
        <div class="hero-content reveal">
            <span class="eyebrow eyebrow-gold">
                <i class="fa-solid fa-sparkles"></i> Women's Luxury Beauty Salon
            </span>
            
            <h1 class="hero-title">Ava's Glow Studio</h1>
            
            <p class="hero-lead">
                A luxury sanctuary of bespoke hair artistry, radiant skincare, and personalized beauty care.
            </p>

            <div class="hero-actions">
                <a class="button button-primary hero-btn-main" href="{% url 'booking' %}">
                    <i class="fa-solid fa-calendar-check"></i> Book Now
                </a>
                <a class="button button-ghost" href="#location">
                    <i class="fa-solid fa-location-dot"></i> Get Location
                </a>
            </div>
        </div>
    </div>

    <div class="hero-scroll">
        <span>Explore</span>
        <div class="hero-scroll-line"></div>
    </div>
</section>
