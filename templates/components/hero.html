{% load static %}

<section class="hero section-pad" style="background-image: url('{% static 'images/hero.jpg' %}');">
    <div class="container hero-grid hero-grid-minimal">
        <div class="hero-copy">
            <span class="eyebrow">Premium Grooming Experience</span>
            <span class="eyebrow-line"></span>
            <h1>Where Every Cut<br><em>Tells a Story</em></h1>
            <p class="hero-lead">
                Precision cuts and luxury grooming crafted for the modern gentleman.
            </p>

            <div class="hero-actions">
                <a class="button button-primary" href="{% url 'booking' %}"><i class="fa-solid fa-calendar-check"></i>
                    Book Appointment</a>
                <a class="button button-ghost" href="#services"><i class="fa-solid fa-scissors"></i> View Services</a>
            </div>
        </div>
    </div>

    <div class="hero-scroll">
        <span>Scroll</span>
        <div class="hero-scroll-line"></div>
    </div>
</section>

<!-- STATS BANNER -->
<section class="stats-banner">
    <div class="container">
        <div class="stats-grid">
            <div class="stat-item reveal">
                <span class="stat-number" data-count="500">0</span>
                <span class="stat-label">Happy Clients</span>
            </div>
            <div class="stat-item reveal" data-delay="100">
                <span class="stat-number" data-count="5">0</span>
                <span class="stat-label">Years of Craft</span>
            </div>
            <div class="stat-item reveal" data-delay="200">
                <span class="stat-number" data-count="4.9" data-decimals="1">0</span>
                <span class="stat-label">Star Rating</span>
            </div>
            <div class="stat-item reveal" data-delay="300">
                <span class="stat-number" data-count="6">0</span>
                <span class="stat-label">Expert Barbers</span>
            </div>
        </div>
    </div>
</section>

<div class="section-divider reveal">
    <i class="fa-solid fa-scissors"></i>
</div>
