<section class="section-pad gallery-section" id="gallery">
    <div class="container">
        <div class="section-heading reveal">
            <h2>Gallery</h2>
            <p>Take a look inside our salon and our work.</p>
        </div>

        <div class="gallery-grid">
            {% for image in gallery %}
                <figure class="gallery-card reveal-scale" {% if forloop.counter0 > 0 %}data-delay="{{ forloop.counter0 }}0"{% endif %}>
                    {% if image.image %}
                        <img src="{{ image.image.url }}" alt="{{ image.caption|default:'Ava\'s Glow Studio' }}" loading="lazy">
                    {% endif %}
                    {% if image.caption %}
                        <figcaption>{{ image.caption }}</figcaption>
                    {% endif %}
                </figure>
            {% empty %}
                <div class="empty-state">Studio photos and transformation highlights are coming soon.</div>
            {% endfor %}
        </div>
    </div>
</section>

<div class="section-divider reveal">
    <i class="fa-solid fa-spa"></i>
</div>
