<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Staff Login — Ava's GLOW STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #FAF7F2;
            color: #222E23;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -10rem;
            left: 50%;
            transform: translateX(-50%);
            width: 35rem;
            height: 35rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(194, 162, 119, 0.18), transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -8rem;
            right: 10%;
            width: 25rem;
            height: 25rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 127, 96, 0.12), transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid rgba(100, 127, 96, 0.18);
            border-radius: 24px;
            padding: clamp(32px, 5vw, 48px);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(34, 46, 35, 0.08);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: cardEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-mark {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(100, 127, 96, 0.12), rgba(194, 162, 119, 0.2));
            color: #647F60;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
            border: 1px solid rgba(100, 127, 96, 0.25);
            box-shadow: 0 4px 12px rgba(100, 127, 96, 0.15);
        }

        .brand-header-title {
            font-family: 'Allura', cursive;
            font-size: 2.4rem;
            color: #4B6348;
            line-height: 1;
            margin-bottom: 2px;
        }

        .brand-header-sub {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #5E6D60;
            margin-bottom: 20px;
            display: block;
        }

        .login-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #222E23;
            margin-bottom: 8px;
        }

        .login-card p {
            color: #5E6D60;
            font-size: 0.92rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #222E23;
            margin-bottom: 8px;
        }

        label i {
            color: #647F60;
            margin-right: 4px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            background: #FAF7F2;
            border: 1px solid rgba(100, 127, 96, 0.2);
            border-radius: 12px;
            color: #222E23;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #88968A;
        }

        input:focus {
            background: #FFFFFF;
            border-color: #647F60;
            box-shadow: 0 0 0 3px rgba(100, 127, 96, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #647F60 0%, #4B6348 100%);
            color: #FFFFFF;
            font-weight: 600;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.98rem;
            margin-top: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(100, 127, 96, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(100, 127, 96, 0.35);
            background: linear-gradient(135deg, #829E7E 0%, #647F60 100%);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
            font-size: 0.88rem;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-mark">
            <i class="fa-solid fa-spa"></i>
        </div>
        <div class="brand-header-title">Ava's</div>
        <span class="brand-header-sub">GLOW STUDIO</span>
        
        <h2>Staff Portal Login</h2>
        <p>Enter your credentials to access the studio management system.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Staff Username</label>
                <input type="text" name="username" required placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard</button>
        </form>
    </div>

</body>
</html>
